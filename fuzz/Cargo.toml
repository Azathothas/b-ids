# The fuzz targets. docs/history/todo/harness.md, HARNESS-09.
#
# ⛔ ITS OWN CRATE, OUTSIDE THE WORKSPACE, and the exclusion in the root
# Cargo.toml is what makes that true. Cargo resolves a path dependency against
# the OUTERMOST workspace that does not exclude it, so without that line this
# manifest inherits a lints table and a dependency set it does not carry, and
# the build fails on a key it has never had. The vendored tree paid for that
# measurement first; this is the second crate it applies to.
#
# ⚠ IT NEEDS A NIGHTLY TOOLCHAIN. libFuzzer arrives through -Z sanitizer, which
# stable does not have, and rust-toolchain.toml pins this tree to an exact
# stable compiler on purpose. So this is NOT part of the ordinary gate:
# crates/b-ids-harness/tests/hostile.rs is the half that runs everywhere, over
# the same drive_every_parser this target calls.

[package]
name = "b-ids-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
b-ids-harness = { path = "../crates/b-ids-harness" }

# ⛔ Optimised with debug assertions ON. A fuzz run built without them misses
# every overflow and every debug-only invariant, which is a large share of what
# a fuzzer is for.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false
