# The workspace. TODO/tooling.md, TOOL-01.
#
# ⛔ THE TOOLCHAIN IS PINNED IN rust-toolchain.toml TO AN EXACT VERSION, never a
# floating channel, so every host builds this tree with one compiler.
#
# ⛔ rust-version BELOW IS DERIVED, NOT CHOSEN. scripts/common/check-msrv.sh
# reads the floor the resolved dependency graph imposes and refuses a declared
# value under it; its --verify leg compiles the workspace with the declared
# toolchain. A number nobody derived is a claim rather than a constraint.

[workspace]
resolver = "3"
members = ["crates/*"]

# ⛔ THE VENDORED TREES ARE EXCLUDED, and the exclusion is load-bearing rather than tidy.
# Cargo resolves a path dependency against the OUTERMOST workspace that does not exclude it, so
# without this line vendor/rustls/rustls inherits from THIS table and the build fails on the
# first key it does not carry. Measured 2026-09-01: "dependency.aws-lc-rs was not found in
# workspace.dependencies". TODO/vendor.md, VENDOR-01.
#
# ⚠ `fuzz` is here for the same reason and it is the second crate to need it.
# It is a cargo-fuzz crate with its own edition and its own dependency set, and
# it builds only on a nightly toolchain. TODO/harness.md, HARNESS-09.
exclude = ["vendor", "fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
license = "0BSD"
repository = "https://github.com/Azathothas/b-ids"

# ⛔ deny rather than forbid. docs/conventions/code.md allows an escape hatch
# with a comment saying why, and forbid removes the possibility of writing one.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# ⛔ ONE VERSION PER LIBRARY, DECLARED HERE, so two crates cannot pin one
# library twice and drift. A member depends on `serde.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ⚠ h2 CROSSES A SEAM WITH BOTH OF THESE IN ITS SIGNATURES, so they are pinned
# here rather than in the one crate that names them: two versions of `bytes` in
# one binary is two `BufMut` traits and a type error nobody can read.
bytes = "1"
http = "1.1"

# ⭐ VENDORED, not a registry dependency. TODO/vendor.md, VENDOR-01, and the ruling is in
# TODO/RULES.md: the TLS terminator is vendored here and patched here, so the seam HARNESS-13
# needs is one this tree can open. vendor/upstream.json says at which commit, patches/README.md
# says what was changed, and scripts/common/check-vendor.sh asserts the manifest still describes
# the tree.
#
# ⚠ The features are named rather than defaulted. The default provider is aws-lc-rs, which needs
# cmake and bindgen; ring needs a C compiler alone, and this host resolves one through the
# Visual Studio Build Tools install without cl.exe being on PATH.
rustls = { path = "vendor/rustls/rustls", default-features = false, features = ["std", "ring", "tls12", "logging"] }

# ⛔ NOT vendored, and that is the ruling rather than an oversight. The ruling is about the TLS
# TERMINATOR; a certificate minter this project never patches would buy a reconciliation cost
# and nothing else. It is pinned in the committed Cargo.lock like any other dependency.
#
# ⚠ Its crypto backend is named rather than defaulted, for the same reason as rustls above, and
# it has to be the SAME backend: two crypto libraries in one binary is two builds of the same
# primitives and a second C toolchain requirement.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }

# ⭐ VENDORED AND PATCHED, ruled by the operator 2026-09-04 against the
# recommendation attached to the question. TODO/emitters.md, EMIT-03.
#
# ⛔ THE PATCH IS FIVE BYTES AND UPSTREAM WILL NOT TAKE IT, for a stated reason
# rather than by neglect: RFC 9113 deprecates stream priority, so a release
# adding a way to send one would add a way to do what the specification tells
# clients not to do. Every profile in this corpus carries the block, six of six
# across two browsers, two majors and two platforms, all at 1:1:0:255.
#
# ⚠ THE `unstable` FEATURE IS UPSTREAM'S OWN, not something this patch added. It
# makes `frame` and `proto` public, which is what lets this project's emitter
# build a HEADERS frame and hand it to its own reader. ⛔ It is what upstream
# says it is: an API with no backwards-compatibility promise, which is exactly
# the trade a vendored tree exists to make.
#
# ⚠ It brings eleven crates including an async runtime into a workspace that was
# serde and serde_json. That cost was named in the question and accepted in the
# ruling. docs/methodology/vendoring.md says vendoring is chosen rather than
# drifted into, and this is the choosing.
h2 = { path = "vendor/h2", features = ["unstable"] }
