#    2. accept
#    3. accept-language
#    4. accept-encoding
#    5. upgrade-insecure-requests
#    6. sec-fetch-dest
#    7. sec-fetch-mode
#    8. sec-fetch-site
#    9. sec-fetch-user
#   10. priority
#   11. te
