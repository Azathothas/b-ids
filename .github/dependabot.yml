# Automated dependency updates.
#
# Workflow actions are pinned to immutable SHAs, so the updater must move both
# the SHA and version comment. Cargo updates cover registry dependencies in the
# workspace lockfile; vendored path dependencies are maintained separately.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    labels:
      - dependencies
