# Does trusting a real root change what the browser puts on the wire, against
# trusting one key for one launch? TODO/harness.md, HARNESS-14.
#
# ⛔ THIS JOB EXISTS BECAUSE THE MACHINE IS THROWN AWAY. Installing a root
# certificate is a change to a machine's security configuration, and the
# operator ruled 2026-09-01 that it belongs on a runner rather than on anybody's
# desktop. experiments/50-trust-anchor.sh REFUSES to install one unless
# B_IDS_DISPOSABLE=1 says so, and this is the only place that variable is set.
#
# ⭐ EVERY CAPTURE THIS PROJECT HAS TAKEN WENT THROUGH A PER-LAUNCH KEY PIN, and
# `captured.trust` records it. Whether that changed the hello has never been
# measured, and until it is, every profile in the corpus is a reading taken under
# a configuration nobody has checked.
#
# ⚠ TWO PLATFORMS, BECAUSE THE STORE A BROWSER READS IS A PLATFORM FACT.
# docs/inherited-claims.md section 8 records that Chrome on Linux does not read
# the user's NSS database for server authentication, so the Linux lane is
# EXPECTED to report that the trust-store route completed no handshake. ⛔ That
# is a result and it is published as one rather than treated as a broken job.
#
# ⛔ FAIL-FAST OFF. The two lanes answer about two platforms and one failing
# says nothing about the other.
#
# ⛔ NOTHING HERE WRITES TO THE REPOSITORY. It publishes a report as an artefact
# and the session that reads it writes the entry.
#
# ⛔ THIRD-PARTY ACTIONS ARE PINNED TO A COMMIT, NOT A TAG. The pins are the ones
# capture.yml already carries.
#
# ⚠ NOTHING HERE NAMES AN OWNER OR A REPOSITORY.

name: trust-anchor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-anchor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: ${{ matrix.platform }} pin against trust store
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux64
          - os: windows-latest
            platform: win64
    env:
      # ⛔ THE ONE PLACE THIS IS SET. A runner is reclaimed when the job ends, so
      # the install undoes itself even if the script's own teardown does not run.
      B_IDS_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: the pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          cargo --version

      # ⛔ RESOLVED, NOT ASSUMED, AND A LANE WITH NO BROWSER EXITS 2. CI-07.
      - name: what browser this runner has
        id: resolve
        shell: bash
        run: |
          set +e
          cargo run -q -p b-ids-driver -- resolve --browser chrome --json > resolved.jsonl
          rc=$?
          set -e
          cat resolved.jsonl || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] || [ "$rc" = 2 ]

      # ⚠ EXIT 1 IS A FINDING AND EXIT 2 IS "COULD NOT RUN", and neither fails
      # this job: what the run produces is a REPORT, and a platform where the
      # trust-store route completes nothing is exactly the result
      # docs/inherited-claims.md section 8 predicts for Linux. CI-07.
      - name: pin against trust store
        if: steps.resolve.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          sh experiments/50-trust-anchor.sh --headless --browser chrome --rounds 2 | tee report.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "trust-anchor exit=$rc"
          echo "$rc" > exit-code.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trust-anchor-${{ matrix.platform }}
          path: |
            report.txt
            exit-code.txt
            resolved.jsonl
            .tmp/50-trust-anchor/
          if-no-files-found: warn
          retention-days: 14
