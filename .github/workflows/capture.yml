# The capture matrix. One job per browser, channel and host, every lane allowed
# to fail alone. TODO/ci.md, CI-03.
#
# ⛔ FAIL-FAST OFF, ALWAYS, AND IT IS THE ENTRY RATHER THAN A SETTING. The DEFAULT
# behaviour of a matrix is to cancel every sibling when one lane fails, so a
# workflow acquires that by saying nothing. A run in which a browser download
# 404s would then publish nothing from the lanes that worked.
# scripts/common/check-workflows.sh is what refuses a matrix without it.
#
# ⛔ NO LANE WRITES TO THE REPOSITORY. Each uploads its profile and its raw
# capture as an artefact and the collect job merges them. That is why every job
# here keeps `contents: read`: a lane runs a browser it downloaded, and a
# browser download is the last thing that should hold a write token.
#
# ⭐ THE COLLECT JOB RUNS EVEN WHEN LANES FAILED. A run where three lanes failed
# still publishes the ones that worked and names the three. Partial data with an
# honest gap beats no data, and `if: always()` is what makes it so.
#
# ⚠ A TIGHT PER-JOB LIMIT. A hung browser holds a runner, and browsers hang. A job
# with no limit inherits the platform's six hours.
#
# ⛔ THE FUZZ LANE SETS RUSTUP_TOOLCHAIN EXPLICITLY, and finding out why cost a
# run. rust-toolchain.toml pins this tree to an exact stable and applies to
# every crate under the root including fuzz/, so a nightly IMAGE is not enough:
# rustup reads the toolchain file, downloads the pinned stable, and `-Z
# sanitizer` is then refused as a nightly-only option. fuzz/README.md carries
# the measurement.
#
# ⛔ THIRD-PARTY ACTIONS ARE PINNED TO A COMMIT, NOT A TAG. The checkout pin is
# the one ci.yml already carries; the two artefact pins are this file's own.
# Every one was RESOLVED rather than recalled:
#
#   gh api repos/actions/checkout/git/ref/tags/v7.0.1 --jq .object.sha
#   gh api repos/actions/upload-artifact/git/ref/tags/v7.0.1 --jq .object.sha
#   gh api repos/actions/download-artifact/git/ref/tags/v8.0.1 --jq .object.sha
#
# ⚠ AND THE RUNTIME EACH TAG DECLARES IS READ, not only that the tag resolves. The
# v4 artifact actions still declare node20, which the platform is deprecating, so
# the pins below are the newest releases rather than the ones ci.yml happens to
# carry. Read from each action.yml at the pinned commit:
#
#   gh api repos/OWNER/NAME/contents/action.yml?ref=SHA --jq .content | base64 -d | grep using:
#
#   actions/checkout            3d3c42e5...  using: node24
#   actions/upload-artifact     043fb46d...  using: node24
#   actions/download-artifact   3e5f45b2...  using: node24
#
# ⚠ NOTHING HERE NAMES AN OWNER OR A REPOSITORY.

name: capture

on:
  # ⛔ A SCHEDULE, NOT A PUSH TRIGGER. A browser shipping a new version is not a
  # defect in a commit, and asserting current versions on push makes every
  # unrelated change fail on the day a browser ships. CI-02.
  # ⚠ THE DAY AFTER browsers typically ship, so a release has settled, and an
  # ODD MINUTE, because every scheduled job on a shared platform queues on the
  # hour.
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:

# Least privilege, on every job here. CI-04 is the entry that opens a pull
# request, and the write it needs belongs to that job and to no other.
permissions:
  contents: read

# A concurrency group per workflow, so a re-run cancels the previous one rather
# than racing it for the same artefact names.
concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⭐ THE MATRIX IS READ FROM THE TREE, NOT WRITTEN HERE. .github/capture-matrix.json
  # is the plan and scripts/common/check-coverage reads the same file to say what
  # landed, so the plan and the report cannot disagree. A matrix written into
  # this file and a coverage report written from somewhere else is a value in two
  # places with no check that they agree.
  #
  # ⛔ ONLY THE ENABLED CELLS FAN OUT. A cell the plan marks disabled is PLANNED
  # and not attempted, and the coverage report says so rather than dropping it.
  #
  # ⚠ A PLAN THAT YIELDS NO LANE FAILS THIS JOB rather than fanning out to
  # nothing. An empty matrix is a run that quietly captures nothing and reports
  # success, which is the "step that exits 0 having done nothing it was asked to
  # do" row in docs/conventions/forbidden-patterns.md.
  plan:
    # manual: jq -c '[.cells[] | select(.enabled)]' .github/capture-matrix.json
    name: read the capture matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.read.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        shell: bash
        run: |
          lanes=$(jq -c '[.cells[] | select(.enabled)]' .github/capture-matrix.json)
          count=$(printf '%s' "$lanes" | jq 'length')
          echo "enabled cells: $count"
          printf '%s\n' "$lanes"
          [ "$count" -ge 1 ]
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"

  lane:
    # manual: sh experiments/10-first-profile.sh --headless --browser chrome
    name: ${{ matrix.browser }} ${{ matrix.channel }} ${{ matrix.platform }}
    needs: [plan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: the pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          cargo --version

      # ⭐ PROVISION FIRST, WHERE THE CELL ASKS FOR IT. A cell whose route is
      # `installed` measures whatever the image shipped, which is what every
      # profile in the corpus records today and why DRIVER-08 exists. A cell
      # naming any other route purges the machine and installs the build the
      # cell names, and the profile then carries a URL and a digest in
      # `captured.acquisition`.
      #
      # ⛔ B_IDS_DISPOSABLE IS SET ON THIS STEP AND NOWHERE ELSE IN THIS FILE.
      # provision-browser needs it AND the platform's own CI marker, from two
      # sources, because one edit lifting one condition is how the purge path
      # reached a developer laptop on 2026-09-02.
      #
      # ⛔ AND THE LANE FAILS LOUDLY WHEN PROVISIONING DOES NOT CONFIRM. The
      # tool's own step 4 requires `resolve` to report exactly the build asked
      # for; nothing here swallows a nonzero exit, so a lane that installed one
      # build and would have captured another goes red instead.
      - name: provision the build this cell names
        if: matrix.route != 'installed'
        shell: bash
        env:
          B_IDS_DISPOSABLE: '1'
        run: |
          sh scripts/common/provision-browser.sh \
            --browser "${{ matrix.browser }}" \
            --route "${{ matrix.route }}" \
            --version "${{ matrix.build }}"

      # ⛔ RESOLVED, NOT ASSUMED, AND A LANE WITH NO BROWSER EXITS 2. "This runner
      # has no browser" and "the capture failed" are different facts, and a lane
      # that returned 1 for both would make an absent browser look like a
      # regression. CI-07.
      # ⛔ THE LANE NAMES ITS FAMILY, and it is the plan's value rather than a
      # constant here. Before 2026-09-02 the driver took whichever family
      # resolved first, so an `edge` lane would have driven Chrome and labelled
      # it Chrome: a matrix column that reached nothing. TODO/corpus.md,
      # CORPUS-02.
      - name: what browser this runner has
        id: resolve
        shell: bash
        run: |
          set +e
          cargo run -q -p b-ids-driver -- resolve --browser "${{ matrix.browser }}" --json > resolved.jsonl 2> resolve.err
          rc=$?
          set -e
          cat resolve.err || true
          cat resolved.jsonl || true
          echo "resolve exit=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 2 is "this runner has no browser", which is not a failure of the
          # tree and must not read as one. Anything else is.
          [ "$rc" = 0 ] || [ "$rc" = 2 ]

      - name: capture
        if: steps.resolve.outputs.rc == '0'
        shell: bash
        run: sh experiments/10-first-profile.sh --headless --browser "${{ matrix.browser }}"

      # ⭐ THE CAPTURE PATH IS THE ONE A PERSON RUNS. experiments/10-first-profile.sh
      # is the manual equivalent CI-08 requires, so the lane runs it rather than
      # a second pipeline written here. Two pipelines is two things to keep
      # correct and one of them stops being run.
      # ⚠ HEADLESS ON A RUNNER, and it is a condition of the measurement rather
      # than a convenience: a hosted runner has no display. DRIVER-03 records
      # the substitution it makes to the product token.
      # ⛔ EVERY LANE UPLOADS ITS OWN ARTEFACT AND WRITES NOTHING TO THE TREE.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capture-${{ matrix.browser }}-${{ matrix.channel }}-${{ matrix.platform }}
          path: |
            corpus/
            raw/
            .tmp/10-first-profile/
            .tmp/provision-browser/acquisition.json
          if-no-files-found: warn
          retention-days: 14

  # ⚠ THE FUZZ LANE, WHICH IS NOT A BROWSER LANE AND IS HERE ANYWAY. It fails
  # alone like every other lane, it needs no browser, and it is the one job in
  # this repository that must override the pinned toolchain.
  fuzz:
    # manual: cargo fuzz run parsers -- -runs=100000
    name: fuzz the parsers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ⛔ SET EXPLICITLY. rust-toolchain.toml pins an exact stable and applies to
      # fuzz/ too, so a nightly image is not enough. fuzz/README.md carries the
      # measurement that cost a run to make.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: the toolchain this lane actually gets
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup show active-toolchain
          cargo --version
      - name: cargo-fuzz
        shell: bash
        run: cargo install cargo-fuzz --locked
      - name: one hundred thousand runs
        shell: bash
        run: cargo fuzz run parsers -- -runs=100000

  # ⭐ ONE COLLECT JOB, ONE PULL REQUEST, AND IT RUNS REGARDLESS. Thirty pull
  # requests a night is how an automated project gets muted, and a collect job
  # that only runs when every lane passed publishes nothing on the nights it
  # matters most.
  collect:
    # manual: sh scripts/common/check-coverage.sh
    # manual: sh scripts/common/check-pr-body.sh --fixture
    name: collect
    needs: [plan, lane, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ⛔ THE WRITE IS JOB-SCOPED AND IT IS THE RUN'S OWN TOKEN. Ruled by the
    # operator 2026-09-02: `contents: write` and `pull-requests: write` on this
    # job alone, never at the top of the file and never a personal access token.
    # Every lane above keeps `contents: read`, because a lane runs a browser it
    # downloaded. TODO/ci.md, CI-04.
    #
    # ⚠ IT ALSO NEEDS A REPOSITORY SETTING THIS FILE CANNOT GRANT: Actions must
    # be allowed to create pull requests. That is the operator's to enable, and
    # the step below reports the refusal rather than failing the run silently.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: lanes

      # ⛔ WHAT COULD NOT BE DONE IS NAMED, NEVER OMITTED. A run that silently
      # drops a lane is worse than one that says it could not capture it, and
      # this is the line CI-04's pull-request body is built from.
      - name: which lanes produced anything
        shell: bash
        run: |
          echo "lane results: ${{ needs.lane.result }}, fuzz: ${{ needs.fuzz.result }}"
          if [ ! -d lanes ]; then
            echo "no lane produced an artefact at all"
            exit 0
          fi
          found=0
          for d in lanes/*/; do
            [ -d "$d" ] || continue
            n=$(find "$d" -name '*.json' -path '*/corpus/*' | wc -l)
            echo "  $(basename "$d"): $n profile file(s)"
            found=$((found + n))
          done
          echo "profiles collected: $found"

      # ⭐ THE COVERAGE REPORT, WHICH IS WHAT SAYS WHAT THE MATRIX DID NOT DO.
      # CORPUS-02 owns the check; this is where its answer is published.
      - name: coverage
        shell: bash
        run: |
          set +e
          sh scripts/common/check-coverage.sh --json
          rc=$?
          set -e
          echo "coverage exit=$rc"
          [ "$rc" != 1 ] || echo "a required row has no capture at all"

      # ⭐ THE STATE THIS RUN WOULD PUBLISH, BESIDE THE ONE THAT IS PUBLISHED.
      # `before` is the checkout and `after` is the checkout with this run's
      # lane artefacts merged over it, so the generator compares two corpus
      # states rather than being told what changed.
      # ⛔ NOTHING IS MERGED INTO THE WORKING TREE HERE. A copy is built under
      # .tmp, which is ignored, so a step that fails leaves the checkout as it
      # was.
      - name: the corpus this run would publish
        id: merge
        shell: bash
        run: |
          mkdir -p .tmp/collect/before .tmp/collect/after
          cp -r corpus raw .tmp/collect/before/ 2>/dev/null || true
          cp -r corpus raw .tmp/collect/after/ 2>/dev/null || true
          if [ -d lanes ]; then
            for d in lanes/*/; do
              [ -d "$d" ] || continue
              [ -d "$d/corpus" ] && cp -r "$d/corpus" .tmp/collect/after/
              [ -d "$d/raw" ] && cp -r "$d/raw" .tmp/collect/after/
            done
          fi
          before=$(find .tmp/collect/before/corpus -name '*.json' 2>/dev/null | wc -l)
          after=$(find .tmp/collect/after/corpus -name '*.json' 2>/dev/null | wc -l)
          echo "profile files before=$before after=$after"

      # ⛔ EVERY FIELD IS A FACT THIS RUN MEASURED. The generator refuses a run
      # file missing one, so nothing here can produce a body with a blank where
      # a run identifier belongs.
      # ⚠ WHAT THE RUN COULD NOT DO IS NAMED, and a lane result that is not
      # `success` is exactly that.
      - name: what this run would open
        id: requests
        shell: bash
        run: |
          set +e
          sh scripts/common/check-formats.sh > .tmp/collect/formats.log 2>&1
          formats_rc=$?
          cargo run -q -p b-ids-corpus -- validate --root .tmp/collect/after > .tmp/collect/validate.log 2>&1
          set -e
          findings=$(awk -F'findings:' '/^corpus=validate /{ split($2, a, / /); n = a[1] } END { print n + 0 }' .tmp/collect/validate.log)
          unavailable='[]'
          if [ "${{ needs.lane.result }}" != "success" ]; then
            unavailable='["at least one capture lane did not succeed: see the lane jobs of this run"]'
          fi
          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg image "$ImageOS-$ImageVersion" \
            --arg validator "$(cat .tmp/collect/validate.log)" \
            --argjson findings "$findings" \
            --argjson unavailable "$unavailable" \
            --argjson formats "$([ "$formats_rc" = 0 ] && echo true || echo false)" \
            '{workflow: "capture.yml", run_id: $run_id,
              images: [["collect", $image]],
              harness: "b-ids-harness 0.0.0",
              command: "sh experiments/10-first-profile.sh --headless --browser BROWSER",
              unavailable: $unavailable, validator_output: $validator,
              validator_findings: $findings, formats_round_trip: $formats}' \
            > .tmp/collect/run.json
          cargo run -q -p b-ids-corpus -- pull-request \
            --before .tmp/collect/before --after .tmp/collect/after \
            --run .tmp/collect/run.json --out .tmp/collect/requests | tee .tmp/collect/requests.log
          n=$(awk -F'requests:' '/^corpus=pull-request /{ split($2, a, / /); r = a[1] } END { print r + 0 }' .tmp/collect/requests.log)
          echo "requests=$n" >> "$GITHUB_OUTPUT"

      # ⭐ A NO-OP RUN OPENS NOTHING AND COMMENTS NOTHING. Silence is the correct
      # output for a browser that did not change, and a bot that writes on a
      # schedule trains people to ignore it. The `if` is that rule.
      #
      # ⛔ IT NEVER FORCE-PUSHES OVER A COMMIT THAT IS NOT ITS OWN. The bot
      # branch is checked for a commit whose author is not the platform's own
      # actor, and a lane that finds one stops with a message rather than
      # destroying somebody's work.
      - name: open or update one pull request per route
        if: steps.requests.outputs.requests != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=$(git rev-parse --abbrev-ref HEAD)
          for dir in .tmp/collect/requests/*/; do
            [ -d "$dir" ] || continue
            branch=$(cat "$dir/branch")
            title=$(cat "$dir/title")
            echo "== $branch =="
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch origin "$branch"
              author=$(git log -1 --format='%an' "origin/$branch")
              if [ "$author" != 'github-actions[bot]' ]; then
                echo "⛔ $branch has a commit by $author, so this run will not touch it"
                continue
              fi
              git checkout -B "$branch" "origin/$branch"
            else
              git checkout -B "$branch" "$base"
            fi
            cp -r .tmp/collect/after/corpus .tmp/collect/after/raw .
            git add corpus raw
            if git diff --cached --quiet; then
              echo "nothing to commit on $branch"
              git checkout "$base"
              continue
            fi
            git commit -m "$title"
            git push --force-with-lease origin "$branch"
            if gh pr view "$branch" >/dev/null 2>&1; then
              gh pr edit "$branch" --title "$title" --body-file "$dir/body.md"
            else
              # ⚠ A refusal here is usually the repository setting that lets
              # Actions create pull requests, which this file cannot grant.
              gh pr create --base "$base" --head "$branch" --title "$title" \
                --body-file "$dir/body.md" \
                || echo "⛔ could not open a pull request. Allow GitHub Actions to create pull requests in the repository settings"
            fi
            while read -r label; do
              [ -n "$label" ] || continue
              gh pr edit "$branch" --add-label "$label" || echo "no label $label"
            done < "$dir/labels"
            git checkout "$base"
          done
