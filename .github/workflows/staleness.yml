# Is the corpus behind the build the vendor is serving? docs/history/todo/ci.md, CI-02.
#
# ⛔ A SCHEDULE, NEVER A PUSH TRIGGER, AND IT IS THE ENTRY RATHER THAN A
# PREFERENCE. A browser shipping a new version is not a defect in a commit, and
# asserting current versions on push makes every unrelated change fail on the
# day a browser ships. The corpus is asserted against itself on push, by
# validate.yml; what is CURRENT is asked here, on a clock.
#
# ⚠ THE DAY AFTER browsers typically ship, so a release has settled, and an ODD
# MINUTE, because every scheduled job on a shared platform queues on the hour.
# Both are inherited scheduling details worth keeping;
# docs/reference-sweeps/usable.md section 10.
#
# ⭐ WHEN IT GOES RED ITS OUTPUT CARRIES THE REPLACEMENT VALUES. A check that
# only said a fingerprint changed would be half a tool: every stale row names
# the route, the build it holds, the build that is serving, the rollout fraction
# and every source that answered.
#
# ⭐ IT HEALS BEFORE IT ALARMS. A corpus that is behind dispatches capture.yml,
# which captures, lands what meets every merge condition and opens one request
# for the rest. A browser shipping on Tuesday is not a fault.
#
# ⛔ AND IT GOES RED WHEN THE PIPELINE IS STUCK, which is the signal this file
# promised and, until 2026-10-11, never gave: every step ended `exit 0`, so it
# reported green for five weeks while it printed "2 of 2 route(s) are behind"
# and the corpus held Chrome 152 against a serving 155. Stuck means BEHIND and
# the newest capture on a stale route older than STUCK_AFTER_DAYS: a capture
# that ran in that window and landed nothing is a capture that is broken or a
# request nobody reviewed, and either needs a person. health.yml turns the red
# run into an issue.
#
# ⚠ Exit 2 means no source answered, which is a fact about the vendor's
# endpoints rather than about this repository. It is annotated as a warning
# and does not fail the job. CI-07.
#
# ⛔ THIRD-PARTY ACTIONS ARE PINNED TO A COMMIT, NOT A TAG. The checkout pin is
# the one ci.yml and capture.yml already carry.
#
# ⚠ NOTHING HERE NAMES AN OWNER OR A REPOSITORY.

name: staleness

on:
  schedule:
    - cron: '23 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staleness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ask:
    # manual: sh scripts/common/check-staleness.sh
    name: what is serving, and what does the corpus hold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      STUCK_AFTER_DAYS: '14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: the corpus against what is serving
        id: staleness
        shell: bash
        run: |
          set +e
          sh scripts/common/check-staleness.sh --json > staleness.json
          rc=$?
          set -e
          cat staleness.json || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = 2 ]; then
            echo "::warning title=staleness::no version source answered, so nothing was compared"
          fi
          [ "$rc" = 0 ] || [ "$rc" = 1 ] || [ "$rc" = 2 ]

      # ⭐ THE HUMAN FORM IS WHAT CARRIES THE REPLACEMENT VALUES, and it is
      # printed only when there is something to report.
      - name: what would replace it
        if: steps.staleness.outputs.rc == '1'
        shell: bash
        run: |
          set +e
          sh scripts/common/check-staleness.sh | tee staleness.txt
          set -e
          {
            echo '## The corpus is behind'
            echo
            echo '```text'
            cat staleness.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: capture the serving build
        if: steps.staleness.outputs.rc == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run capture.yml --ref "${{ github.event.repository.default_branch }}"
          echo "dispatched capture.yml on ${{ github.event.repository.default_branch }}"

      # ⛔ BEHIND AND OLD IS STUCK. The newest capture on any stale route is read
      # from the profile itself, never from a commit date, and a route behind
      # for longer than the window fails this job.
      - name: the pipeline is not stuck
        if: steps.staleness.outputs.rc == '1'
        shell: bash
        run: |
          root=$(sh scripts/common/corpus-root.sh)
          newest=$(find "$root/corpus/v1/chrome/stable" -name '*.json' -exec jq -r '.captured.at' {} + | sort | tail -1)
          [ -n "$newest" ] || { echo "no chrome stable capture to date"; exit 1; }
          age=$(( ( $(date -u +%s) - $(date -u -d "$newest" +%s) ) / 86400 ))
          echo "the newest chrome stable capture is from $newest, $age day(s) ago"
          if [ "$age" -gt "$STUCK_AFTER_DAYS" ]; then
            echo "::error title=staleness::the corpus has been behind the serving build for more than $STUCK_AFTER_DAYS days: capture is not landing. Read the latest capture.yml run and any open capture/run-* pull request."
            exit 1
          fi
