# Is the corpus behind the build the vendor is serving? TODO/ci.md, CI-02.
#
# ⛔ A SCHEDULE, NEVER A PUSH TRIGGER, AND IT IS THE ENTRY RATHER THAN A
# PREFERENCE. A browser shipping a new version is not a defect in a commit, and
# asserting current versions on push makes every unrelated change fail on the
# day a browser ships. The corpus is asserted against itself on push, by
# validate.yml; what is CURRENT is asked here, on a clock.
#
# ⚠ THE DAY AFTER browsers typically ship, so a release has settled, and an ODD
# MINUTE, because every scheduled job on a shared platform queues on the hour.
# Both are inherited scheduling details worth keeping;
# docs/reference-sweeps/usable.md section 10.
#
# ⭐ WHEN IT GOES RED ITS OUTPUT CARRIES THE REPLACEMENT VALUES. A check that
# only said a fingerprint changed would be half a tool: every stale row names
# the route, the build it holds, the build that is serving, the rollout fraction
# and every source that answered.
#
# ⛔ A RED RUN HERE IS THE SIGNAL, NOT A DEFECT IN THE TREE. Exit 1 means the
# corpus is behind and somebody should capture the new build; exit 2 means no
# source answered, which is a fact about the vendor's endpoints rather than
# about this repository, and it is reported without failing the job.
#
# ⛔ READ-ONLY. CI-04 is the entry that opens a pull request from this, and the
# write it needs belongs to that job and to no other. Nothing here writes.
#
# ⛔ THIRD-PARTY ACTIONS ARE PINNED TO A COMMIT, NOT A TAG. The checkout pin is
# the one ci.yml and capture.yml already carry.
#
# ⚠ NOTHING HERE NAMES AN OWNER OR A REPOSITORY.

name: staleness

on:
  schedule:
    - cron: '23 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staleness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ask:
    # manual: sh scripts/common/check-staleness.sh
    name: what is serving, and what does the corpus hold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ⛔ BOTH HALVES, ON THE HOST THAT HAS BOTH. The pair is compared by
      # check-twins on a developer machine; this asserts that the one a schedule
      # actually runs works where it runs.
      - name: the corpus against what is serving
        id: staleness
        shell: bash
        run: |
          set +e
          sh scripts/common/check-staleness.sh --json > staleness.json
          rc=$?
          set -e
          cat staleness.json || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 2 is "no source answered", which is a fact about the vendor rather
          # than about this tree, and it must not read as a stale corpus.
          # CI-07 is the rule.
          [ "$rc" != 2 ] || echo "no source answered; nothing was compared"
          exit 0

      # ⭐ THE HUMAN FORM IS WHAT CARRIES THE REPLACEMENT VALUES, and it is
      # printed only when there is something to report, so a run that found
      # nothing is one line rather than a page.
      - name: what would replace it
        if: steps.staleness.outputs.rc == '1'
        shell: bash
        run: |
          set +e
          sh scripts/common/check-staleness.sh
          echo "the corpus is behind. CI-04 is the entry that opens a pull request from this."
          exit 0
