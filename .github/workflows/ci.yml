# The gates, in CI. Part (a) of the three-part gate: docs/methodology/gate.md
#
# ⛔ THIS RUNS THE SAME CHECKS THE LOCAL GATE RUNS, THROUGH THE SAME RUNNER. It
# is a second PLACE they run, not a second LIST of them. A hand-written list of
# steps here would be a second list, and two lists is how one of them stops
# being maintained.
#
# ⛔ TWO HOSTS, ON PURPOSE. Every check in this repository has a POSIX sh
# implementation and a PowerShell twin, because a native PowerShell session may
# have no POSIX shell at all. A gate that only ever runs on one of them proves
# nothing about the half written for the other.
#
# ⭐ --strict IS THE CI MODE, and it is why the installs below are not optional.
# It turns a skipped check into a failure: on a developer's machine a missing
# tool is a fact about the machine, and on a runner the tools are installed on
# purpose, so a skip means an install broke and the tree went unchecked.
#
# ⛔ THIRD-PARTY ACTIONS ARE PINNED TO A COMMIT, NOT A TAG. A tag moves, and a
# moved tag runs code nobody reviewed with the permissions granted here. The pin
# below was resolved and its declared runtime read, rather than copied:
#
#   gh api repos/actions/checkout/git/ref/tags/v7.0.1 --jq .object.sha
#
# ⚠ AND THE RUNTIME THE TAG DECLARES IS CHECKED, not only that the tag resolves.
# A pinned action on a runtime the platform has deprecated fails in a warning
# nobody reads. ⭐ The durable half of that is .github/dependabot.yml: pinning
# with no updater is how a pin becomes a fossil.
#
# ⚠ NOTHING HERE NAMES AN OWNER OR A REPOSITORY. The workflow has to keep
# working if this tree moves, so there is no branch filter tied to one name and
# no hardcoded slug anywhere in it.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege. No job here needs more than reading the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -- the POSIX half, plus the twin comparison ------------------------------
  checks:
    # manual: sh scripts/common/check-gate.sh --strict
    name: gate (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ⛔ THE WHOLE HISTORY, NOT THE DEFAULT ONE COMMIT. check-corpus runs
      # inside the gate below and its only irreplaceable leg asks git whether a
      # published file was ever modified, deleted or renamed. Under a shallow
      # clone that question is asked of one commit and answered "nothing" every
      # time: the leg ran on both jobs from the day it was written and verified
      # nothing on either. The check refuses a shallow clone now, so losing this
      # line fails the job rather than quietly emptying it. docs/history/todo/ci.md, CI-01.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ⛔ THE TOOLCHAIN IS PINNED BY THE TREE, NOT BY THIS FILE. Naming a
      # version here would be a second copy of the pin, and two copies is how
      # one of them goes stale. rust-toolchain.toml names the exact version and
      # the components; `rustup show active-toolchain` is what reads it and
      # installs it, so this step cannot disagree with the pin.
      # ⚠ The versions are printed rather than asserted here: check-msrv is what
      # asserts, and it runs inside the gate below on both hosts.
      #
      # ⛔ AND IT RUNS BEFORE THE PROBE, WHICH IS NOT COSMETIC ORDERING. `rustc`
      # and `cargo` are rustup proxies, so in a tree pinning a toolchain the
      # runner does not have, the FIRST of them to run installs it. The probe
      # kills anything that has not answered in 6 seconds, and an install killed
      # partway through leaves a component's files on disk that the toolchain's
      # own manifest does not list, which the next install refuses. Installing
      # here means the probe below has nothing left to start.
      # docs/history/todo/ci.md, CI-09.
      - name: the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      # ⚠ THE EXIT CODE IS CAPTURED, NOT ECHOED AFTER THE FACT. A `run:` step is
      # a shell with errexit on, so a non-zero probe aborts the step before any
      # echo, and an echo could therefore only ever print 0. That reads like a
      # verification and asserts nothing.
      - name: the probe runs and exits 0
        run: |
          set +e
          sh scripts/doctor/doctor.sh --fast >/dev/null
          rc=$?
          set -e
          echo "probe exit=$rc"
          [ "$rc" = 0 ]

      # ⛔ INSTALLED EXPLICITLY, because --strict refuses a skip. The analyzer is
      # a module rather than part of PowerShell, and check-powershell.ps1 treats
      # a missing one as SKIPPED and exits 0, which is right on a laptop and
      # wrong here.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      # ⭐ THE WHOLE GATE, IN ONE COMMAND, INCLUDING THE TWIN COMPARISON. Every
      # line it runs delegates to a check that already exists and reads that
      # check's own exit code, unpiped.
      - name: the gate
        run: sh scripts/common/check-gate.sh --strict

      # ⛔ ENUMERATED BY git, NOT BY A GLOB, AND THE COUNT IS ASSERTED. A
      # recursive glob skips dot-directories, and every workflow file here lives
      # under one, so a glob-driven step would iterate zero files, print nothing
      # and exit 0 for as long as it existed. That is the "step that exits 0
      # having done nothing it was asked to do" row in
      # docs/conventions/forbidden-patterns.md, and it has shipped in a
      # workflow whose whole job was validating workflows.
      # ⭐ A step that can only pass verifies its own effect, which here means
      # refusing an empty scope rather than reporting green over it.
      # ⚠ chr(0) rather than a backslash escape: the payload crosses a shell.
      - name: yaml parses
        run: |
          python3 -c "
          import subprocess, sys
          try:
              import yaml
          except ImportError:
              sys.exit('pyyaml missing')
          out = subprocess.run(['git', 'ls-files', '-z', '*.yml', '*.yaml'],
                               capture_output=True, text=True, check=True).stdout
          names = [n for n in out.split(chr(0)) if n and not n.startswith('references/')]
          if not names:
              sys.exit('no yaml file in scope, so this step cannot report a pass')
          bad = 0
          for f in names:
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
                  print('ok  ', f)
              except Exception as e:
                  print('FAIL', f, e); bad = 1
          print(str(len(names)) + ' file(s) parsed')
          sys.exit(bad)
          "

  # -- the Windows half: where the PowerShell in this repository actually runs
  #
  # ⭐ THE POINT OF THIS JOB. Each check has a PowerShell twin because the sh one
  # cannot be assumed to run on Windows: a native session may have no `sed`, and
  # its `sort` is an alias for a cmdlet that succeeds and answers differently.
  # ⛔ Running the twins on ubuntu under pwsh would prove nothing about that.
  windows:
    # manual: pwsh -NoProfile -File scripts/common/check-gate.ps1
    name: gate (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # ⛔ THE WHOLE HISTORY, NOT THE DEFAULT ONE COMMIT. check-corpus runs
      # inside the gate below and its only irreplaceable leg asks git whether a
      # published file was ever modified, deleted or renamed. Under a shallow
      # clone that question is asked of one commit and answered "nothing" every
      # time: the leg ran on both jobs from the day it was written and verified
      # nothing on either. The check refuses a shallow clone now, so losing this
      # line fails the job rather than quietly emptying it. docs/history/todo/ci.md, CI-01.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ⛔ THE SAME PIN, READ FROM THE SAME FILE. See the ubuntu job's copy of
      # this step for why no version is written here, and for why it runs
      # BEFORE the probe rather than after it.
      #
      # ⭐ THIS JOB IS WHERE THAT ORDERING WAS PAID FOR. It ran the probe first,
      # and the probe ran WITHOUT -Fast, so it asked `rustc --version` in a tree
      # pinning a toolchain the runner does not have. The proxy began installing
      # it, the probe killed it at 6 seconds, and the install below then refused
      # the half-written toolchain the kill left:
      #
      #   error: failed to install component:
      #   'rustfmt-preview-x86_64-pc-windows-msvc', detected conflict:
      #   'bin\cargo-fmt.exe'
      #
      # ⚠ The ubuntu job never saw it because it passes --fast, which skips
      # version probes entirely. Three sessions read that asymmetry as the
      # runner being at fault. docs/history/todo/ci.md, CI-09.
      - name: the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: the probe runs and emits valid json
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts\doctor\doctor.ps1 -Json > ps.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $d = Get-Content ps.json -Raw | ConvertFrom-Json
          if ($d.schema -ne 'agent-doctor/1') { Write-Output "wrong schema: $($d.schema)"; exit 1 }
          Write-Output ("schema " + $d.schema + ", " + $d.tools.Count + " tools")

      - name: PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      # ⛔ INSTALLED, NOT SKIPPED. windows-latest carries no shellcheck, so this
      # half reported it as SKIPPED and the assertion below counted two skips
      # where only the twin comparison is allowed one. ⚠ The tempting fix is to
      # widen that assertion, which would turn every future skip green on this
      # job. A shell script is linted on both runners or the lint proves nothing
      # about the half that did not run it.
      - name: shellcheck
        shell: pwsh
        run: |
          choco install shellcheck --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit 1 }
          shellcheck --version

      # ⚠ -Fast HERE, AND THE UBUNTU JOB RUNS THE FULL ONE. The twin comparison
      # runs both halves of every pair and needs a POSIX shell for the sh half;
      # the ubuntu job is where it belongs, and running it twice would double the
      # slowest thing in the gate to prove the same fact.
      # ⛔ -Strict still applies, so a skip other than the twin comparison fails
      # this job.
      - name: the gate, this half
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts\common\check-gate.ps1 -Fast
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $j = pwsh -NoProfile -File scripts\common\check-gate.ps1 -Fast -Json | ConvertFrom-Json
          if ($j.failed -ne 0) { Write-Output "the json reports $($j.failed) failure(s)"; exit 1 }
          if ($j.skipped -gt 1) {
              Write-Output "$($j.skipped) check(s) skipped; only check-twins may be"
              exit 1
          }
          Write-Output "$($j.passed) passed, $($j.skipped) skipped of $($j.total)"

      # ⛔ THE ANALYZER IS ASSERTED NOT TO HAVE BEEN SKIPPED. check-powershell
      # reports a missing module as SKIPPED and exits 0, so a runner that
      # silently stopped installing it would turn this job green over an
      # unanalysed tree.
      - name: the analyzer actually ran
        shell: pwsh
        run: |
          $j = pwsh -NoProfile -File scripts\common\check-powershell.ps1 -Json | ConvertFrom-Json
          if ($j.analyzerSkipped) { Write-Output 'PSScriptAnalyzer was SKIPPED in CI'; exit 1 }
          if ($j.parseErrors -ne 0) { Write-Output "$($j.parseErrors) parse error(s)"; exit 1 }
          Write-Output ("clean over " + $j.files + " file(s)")
