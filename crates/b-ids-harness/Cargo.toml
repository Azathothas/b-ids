[package]
name = "b-ids-harness"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# ⛔ Nothing here is released. docs/history/todo/publish.md, PUB-05, is the entry that
# decides what a package registry ever sees.
publish = false

[lints]
workspace = true

[dependencies]
b-ids-schema = { path = "../b-ids-schema" }
serde.workspace = true
serde_json.workspace = true
# ⛔ The VENDORED tree, at vendor/rustls. docs/history/todo/vendor.md, VENDOR-01.
rustls.workspace = true
# The authority --ca-out mints per run. docs/history/todo/harness.md, HARNESS-13.
rcgen.workspace = true

[dev-dependencies]
b-ids-schema = { path = "../b-ids-schema", features = ["fixtures"] }
# ⛔ A DEV dependency, not a real one. HARNESS-06 is about the parser's model
# and the emitter's model being two types, and its test needs both. The harness
# itself must never depend on the emitter: a capture tool that imported an
# emitter would be one component with two jobs.
b-ids-emit = { path = "../b-ids-emit" }
