[package]
name = "b-ids"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# ⛔ Nothing here is released. TODO/publish.md, PUB-05, is the entry that
# decides what a package registry ever sees.
publish = false

[lints]
workspace = true

[dependencies]
# The model, and nothing else at runtime.
b-ids-schema = { path = "../b-ids-schema" }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
# ⛔ A BUILD DEPENDENCY, and the distinction is the entry. The digest that
# pins a corpus has one home in this tree and a second implementation of SHA-256
# for one identifier is what that home exists to prevent; a build dependency is
# not in a consumer runtime graph, so the read-only path b-ids-corpus names in
# its own manifest stays read-only. TODO/library.md, LIB-01.
b-ids-harness = { path = "../b-ids-harness" }
serde_json.workspace = true

[dev-dependencies]
# ⚠ The suite recomputes the release identifier from the corpus on disk and
# compares it with the embedded one, which is an INDEPENDENT reading rather than
# the build script grading itself.
b-ids-harness = { path = "../b-ids-harness" }
