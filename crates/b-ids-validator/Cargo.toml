[package]
name = "b-ids-validator"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# ⛔ Nothing here is released. TODO/publish.md, PUB-05, is the entry that
# decides what a package registry ever sees.
publish = false

[lints]
workspace = true

[dependencies]
b-ids-schema = { path = "../b-ids-schema" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
b-ids-schema = { path = "../b-ids-schema", features = ["fixtures"] }
# ⛔ A DEV DEPENDENCY, and that is the design rather than an accident. The
# validator is pure logic over the model and takes the reachable list as an
# argument; only `reachable_dimensions` needs to know what THIS project can
# resolve, and it is a test. TODO/validator.md, VALID-03.
b-ids-driver = { path = "../b-ids-driver" }
