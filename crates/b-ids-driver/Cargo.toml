[package]
name = "b-ids-driver"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# ⛔ Nothing here is released. TODO/publish.md, PUB-05, is the entry that
# decides what a package registry ever sees.
publish = false

[lints]
workspace = true

[dependencies]
# The profile model the normalisation writes its provenance into.
b-ids-schema = { path = "../b-ids-schema" }
# ⛔ The JSON is SERIALISED, never formatted. A format string escaping its own
# braces is one edit away from emitting something that does not parse, and it
# is indistinguishable from a surviving template placeholder to the check that
# looks for one.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# ⛔ A DEV dependency. The driver launches a browser; it does not capture, and a
# driver that imported the harness would be one component with two jobs. The
# end-to-end test needs both, which is what a dev dependency is for.
b-ids-harness = { path = "../b-ids-harness" }
# The fixtures feature, so the headless test has a well-formed profile to break
# exactly one field of. ⛔ Nothing in it is a measurement.
b-ids-schema = { path = "../b-ids-schema", features = ["fixtures"] }
# ⛔ A DEV DEPENDENCY, for DRIVER-06's acceptance and nothing else. The rule that
# a branded profile has a vendor entry in its brand list belongs to the
# validator and is asserted there; what this crate owes is the END TO END pass,
# which drives an unbranded acquisition and hands the resulting claim to that
# rule. ⚠ The validator already takes this crate as a dev dependency for
# VALID-03, so the two test graphs point at each other and neither build graph
# does. TODO/driver.md, DRIVER-06.
b-ids-validator = { path = "../b-ids-validator" }
serde_json.workspace = true
